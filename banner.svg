<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Kirtijyoti Senapati — Java Backend Developer</title>
  <desc id="desc">System Engineer at TCS with five years of experience. Spring Boot, microservices and PostgreSQL. A navy and teal banner with a custom KS service-node monogram.</desc>
  <defs>
