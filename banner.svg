      <stop offset="1" stop-color="#102e38"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16333f"/>
      <stop offset="1" stop-color="#0c202e"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
